<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D-Transform</title>
    <style>
        div{
            width: 370px;
            height: 370px;
            background-color: rgba(124, 48, 48, 0.418);
            border-bottom: 2px solid red;
            border-top: 2px dashed blue;
            padding: 10px;
            margin-top: 200px;
            margin-left: 500px;
            transition: 3s;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwNQk9ZZs12xQT3q3QgibZYzXHZENZg0v9G-hrhRwCKRC7d2NqZ6VsWjVI&s=10");
            background-size: cover;
        }
        div:hover{
            /* transform: translate(-100px,-200px) */
            transform: translate(0px) rotate(3600deg);
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEvmgxarQZzt2dwdBzr6P30u1Pc3rBMZIrYyqtOCC-Ow&s=10");
            background-size: cover;
            
            border-radius: 50%;
            
        }
    </style>
</head>
<body align="center">
    <div>
    </div>
    
</body>
</html>
