<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Styling</title>
    <style>
        #img1{
            border: 5px solid rgba(94, 255, 0, 0.493);
            border-radius: 20px;
            width: 300px;
            height: 600px;
        }
        #img2{
            border: 5px solid rgba(48, 56, 168, 0.493);
            border-radius: 50%;
            width: 300px;
            height: 300px;
        }
        #img3{
            border: 5px solid rgba(187, 29, 29, 0.534);
            border-radius: 50%;
            width: 300px;
            height: 600px;
            opacity: 0.5;
        }
        #resp{
            border: 2px solid rgba(0, 0, 0, 0.582);
            max-width: 100%;
            height: auto;
        }
        body{
            background-color: rgba(22, 158, 90, 0.329);
        }
    </style>
</head>
<body align="center">
    <img src="https://i.pinimg.com/736x/0f/e9/db/0fe9dba0b6bdd88ffff97e60e2997355.jpg" id="img1"><br>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThZX0frzoGJffzW0tBr02oMmr22yeKU9oTAqV8KcmLApr_N1eJiHn619Q&s=10" id="img2">
    <br><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpxvkZ4HWFHLVxfE1AudAu0CtUEU0zbMS6dhIj4BlxdztCBWh9Ynvfk-A&s=10" id="img3"><br>
    <br><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZIAvRQ_owrocHHxfIgy76jddzyMU6Fhwaqr8ryRzjs9gXo_R2bNujmCWe&s=10" id="resp"><br>
    
    
</body> 
</html>
