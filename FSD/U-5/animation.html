<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        div{
            width: 400px;
            height: 200px;
            background-color: red;
            border: 4px solid;
            animation-name: hello;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-delay: 1s;
            animation-direction:reverse;
            position:relative;
            transition-delay: 2s;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScQDtinDZhX45a1bPn01TQEOSjW1_u6xuc4F1Bdh2OiS_dtAd-hDdaNv8&s=10");
            background-size: cover;
        }
        @keyframes hello{
            0%{top: 200px; left: -400px;}
            
            100%{top: 200px; left: 1200px;}

        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
