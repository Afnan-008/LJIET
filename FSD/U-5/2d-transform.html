<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D-Transform</title>
    <style>
        div{
            width: 300px;
            height: 100px;
            background-color: rgba(124, 48, 48, 0.418);
            border: 3px solid rgba(98, 98, 160, 0.712);
            padding: 10px;
            margin-top: 200px;
            margin-left: 500px;
        }
        div:hover{
            /* transform: translate(-100px,-200px) */
            transform: rotate(-300deg) translate(-100px,-200px)
        }
    </style>
</head>
<body>
    <div>
        
    </div>
</body>
</html>
