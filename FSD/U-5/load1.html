<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Loading Animation</title>
    <style>
        /* Center the loader on the screen */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }

        /* Container that defines the circular area */
        .circular-loader {
            position: relative;
            width: 80px;
            height: 80px;
        }

        /* Base styles for all spinning dots */
        .circular-loader div {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #3867ff;
            border-radius: 50%;
            transform-origin: 40px 40px; /* Forces rotation around the container center */
            animation: spin-fade 0.7s linear infinite;
        }

        /* Position and delay each element around the 360-degree radius */
        .circular-loader div:nth-child(1) { transform: rotate(0deg); animation-delay: -1.1s; }
        .circular-loader div:nth-child(2) { transform: rotate(45deg); animation-delay: -1.0s; }
        .circular-loader div:nth-child(3) { transform: rotate(90deg); animation-delay: -0.9s; }
        .circular-loader div:nth-child(4) { transform: rotate(135deg); animation-delay: -0.8s; }
        .circular-loader div:nth-child(5) { transform: rotate(180deg); animation-delay: -0.7s; }
        .circular-loader div:nth-child(6) { transform: rotate(225deg); animation-delay: -0.6s; }
        .circular-loader div:nth-child(7) { transform: rotate(270deg); animation-delay: -0.5s; }
        .circular-loader div:nth-child(8) { transform: rotate(315deg); animation-delay: -0.4s; }

        /* Animation timeline for the trailing ripple effect */
        @keyframes spin-fade {
            0% {
                transform: rotate(var(--rotation, 0deg)) scale(1);
                opacity: 1;
            }
            100% {
                transform: rotate(var(--rotation, 0deg)) scale(0.3);
                opacity: 0.1;
            }
        }
    </style>
</head>
<body>

    <!-- Circular container with 8 trailing elements -->
    <div class="circular-loader">
        <div style="--rotation: 0deg;"></div>
        <div style="--rotation: 45deg;"></div>
        <div style="--rotation: 90deg;"></div>
        <div style="--rotation: 135deg;"></div>
        <div style="--rotation: 180deg;"></div>
        <div style="--rotation: 225deg;"></div>
        <div style="--rotation: 270deg;"></div>
        <div style="--rotation: 315deg;"></div>
    </div>

</body>
</html>
