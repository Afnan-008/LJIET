<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    p{
            text-indent: 2em;
            text-transform:capitalize;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-decoration:none ;
            letter-spacing: 2px;
            word-spacing: 2px;
            line-height: 20px;
            text-shadow: 3px 5px 7px red;
            font-size: larger;
            font-style: italic;
            font-variant: small-caps;
    }
    h1{
        
        font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        color: rgb(3, 15, 37);
        font-size: 200px;
        text-align: left;
       
    }
    #abc{
        font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        color: rgba(247, 243, 6, 0.658);
        font-size: 100px;
        text-align: right;
    }
    body{
        background-image: url(https://wallpapercave.com/wp/wp13879451.jpg);
        background-repeat: repeat-x repeat-y;
        background-size: cover;
        background-attachment:fixed ;
    }

    </style>
</head>
<body>
    <h1><span style="color: hsla(210, 100%, 98%, 0.692);">MAX</span> <span style="color: rgba(255, 2, 2, 0.459);">VERST</span><span style="color: rgba(227, 227, 231, 0.671);">APPEN</span></h1>
    <div id="abc"><h2>HONORABLE</h2></div>       
</body>
</html>
