<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Properties</title>
    <style>
        .box1{
            width: 300px;
            height: 150px;
            margin: 30px auto;
            padding: 20px;
            border: 4px solid yellow;
            box-sizing: content-box;
            background-color: beige;
            text-align: center;

        }
        .box2{
            width: 300px;
            height: 150px;
            margin: 30px auto;
            padding: 20px;
            border: 4px solid red;
            box-sizing: border-box;
            background-color: blanchedalmond;
            text-align: center;

        }
    </style>
</head>
<body align="center">
    <div class="box1">
        <h1>Hello from box 1</h1>
    </div>
    <div class="box2">
        <h1>Hello from box 2</h1>
    </div>
</body>
</html>
