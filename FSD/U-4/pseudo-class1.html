<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input:focus{
            background-color: blue;
        }
        button{
            background-color: aqua;
            height: 50px;
            width: 100px;

        }
        button:hover{
            background-color: lightblue;
        }

        ul li:nth-child(2){
            color: red;
            font-weight: bold;
        }
        ul li:not(.special){
            background-color: aqua;
            font-style: italic;
        }
    </style>
</head>
<body align="center">
    <form>
        <br>
        <input type="text" placeholder="Enter Name"><br><br>
        <button href="#">Click Me</button>
    </form>

    <ul>
        <li>Item-1</li>
        <li>Item-2</li>
        <li>Item-3</li>
        <li>Item-4</li>
        <li class="special">Item-5</li>
        <li>Item-6</li>
    </ul>

</body>
</html>
