<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG-Circle</title>
</head>
<body align="center">
    <svg width="500" height="500" style="border: 1px solid black;">
        <circle cx="250" cy="270" r="200" stroke="grey" stroke-width="1" fill="grey"/>
        <circle cx="250" cy="175" r="200" stroke="white" stroke-width="1" fill="white"/>
    </svg><br><br>
    <svg width="500" height="500" style="border: 1px solid black;">
        <circle cx="250" cy="500" r="250" stroke="blue" stroke-width="1" fill="blue"/>
        <circle cx="250" cy="500" r="230" stroke="darkblue" stroke-width="1" fill="darkblue"/>
        <circle cx="250" cy="500" r="210" stroke="skyblue" stroke-width="1" fill="skyblue"/>
        <circle cx="250" cy="500" r="190" stroke="green" stroke-width="1" fill="green"/>
        <circle cx="250" cy="500" r="170" stroke="yellow" stroke-width="1" fill="yellow"/>
        <circle cx="250" cy="500" r="150" stroke="orange" stroke-width="1" fill="orange"/>
        <circle cx="250" cy="500" r="130" stroke="red" stroke-width="1" fill="red"/>
    </svg>

    
</body>
</html>
