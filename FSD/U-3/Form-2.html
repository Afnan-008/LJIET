<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup Form</title>
</head>
<body>

    <form action="#" method="POST" enctype="multipart/form-data">
        
        <fieldset>
            <legend align="center">Signup</legend>

            
            <p>
                Username <input type="text" name="username" placeholder="Enter User Name">
            </p>

            <p>
                Password <input type="password" name="password">
            </p>

            <p>
                Gender 
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </p>

            <p>
                Area of Interest 
                <input type="checkbox" id="ds" name="interest" value="DS">
                <label for="ds">DS</label>
                
                <input type="checkbox" id="dbms" name="interest" value="DBMS">
                <label for="dbms">DBMS</label>
                
                <input type="checkbox" id="cn" name="interest" value="CN">
                <label for="cn">CN</label>
                
                <input type="checkbox" id="fullstack" name="interest" value="Full Stack">
                <label for="fullstack">Full Stack</label>
            </p>

            <p>
                Department 
                <select name="department">
                    <option value="">--Select Department--</option>
                    <option value="cs">Computer Science</option>
                    <option value="it">Information Technology</option>
                </select>
            </p>

            <p>
                address <textarea name="address" rows="5" cols="12"></textarea>
            </p>

            <p>
                Upload CV <input type="file" name="cv" accept=".pdf">
            </p>

            <p>
                Date <input type="date" name="date">
            </p>

            <p>
                Email <input type="email" name="email">
            </p>

            <p>
                <input type="submit" value="Click Me">
                <input type="reset" value="Reset">
            </p>

        </fieldset>
    </form>

</body>
</html>
