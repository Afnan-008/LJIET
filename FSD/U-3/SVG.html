
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline SVG Example</title>
    <style>
        /* Optional: You can style your SVG easily using CSS */
        .icon-star {
            display: block;
            margin: 50px auto;
            transition: transform 0.3s ease;
        }
        .icon-star:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <main style="text-align: center;">
        <h1>My First SVG Shapes</h1>
        
        <!-- The SVG Code Container -->
        <svg class="icon-star" 
             width="200" 
             height="200" 
             viewBox="0 0 24 24" 
             fill="#FFD700" 
             stroke="#B8860B" 
             stroke-width="1"
             xmlns="http://www.w3.org/2000/svg">
            
            <!-- Graphic Path (Draws a Star) -->
            <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.132 9.41l8.2-1.192z"/>
            
        </svg>
    </main>

</body>
</html>
