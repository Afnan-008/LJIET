<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        fieldset {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
        }
        legend {
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 150px;
            vertical-align: top;
        }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"], input[type="date"], input[type="number"], select, textarea {
            width: 250px;
            padding: 3px;
        }
        textarea {
            height: 80px;
        }
        .radio-check-group {
            display: inline-block;
        }
    </style>
</head>
<body>

    <h2>☆Student Registration Form☆</h2>
  

    <form action="form1.html"  method="get">
        
        <!-- Information Section -->
        <fieldset>
            <legend>Information</legend>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" autofocus autocomplete="on" required placeholder="eg : abc">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="eg : abc@123">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="eg : abc@gmail.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" maxlength="10" minlength="10" placeholder="eg : 1234567890">
            </div>
            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-check-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male" style="width: auto; margin-right: 10px;">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female" style="width: auto;">Female</label>
                </div>
            </div>
            <div class="form-group">
                <label>Hobbies:</label>
                <div class="radio-check-group">
                    <input type="checkbox" id="music" name="hobbies" value="music">
                    <label for="music" style="width: auto; margin-right: 10px;">Music</label>
                    <input type="checkbox" id="sports" name="hobbies" value="sports">
                    <label for="sports" style="width: auto;">Sports</label>
                </div>
            </div>
        </fieldset>

        <!-- Additional Information Section -->
        <fieldset>
            <legend>Additional Information</legend>
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
            </div>
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="eg : 18">
            </div>
            <div class="form-group">
                <label for="color">Favorite Color:</label>
                <input type="color" id="color" name="color" value="lightblue">
            </div>
            <div class="form-group">
                <label for="browser">Preferred Browser:</label>
                <input type="text" id="browser" name="browser" placeholder="eg : Tor">
            </div>
            <div class="form-group">
                <label for="branch">Select Branch:</label>
                <select id="branch" name="branch">
                    <option value="" selected disabled>Select Branch</option>
                    <option value="cse">Computer Science</option>
                    <option value="ece">Electronics</option>
                    <option value="me">Mechanical</option>
                </select>
            </div>
        </fieldset>

        <!-- Feedback Section -->
        <fieldset>
            <legend>Feedback</legend>
            <div class="form-group">
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" placeholder="eg : paragraph"></textarea>
            </div>
            <div class="form-group">
                <label for="satisfaction">Satisfaction Level:</label>
                <input type="range" id="satisfaction" name="satisfaction" min="0" max="100" value="50">
            </div>
        </fieldset>

        <!-- Submit Section -->
        <fieldset>
            <legend>Submit Section</legend>
            <input type="submit" value="Submit Form">
            <input type="reset" value="Reset Form">
            <input type="button" value="Click Me">
            <button type="submit">Submit (Button Tag)</button>
        </fieldset>

        <label>
            <input type="file" value="Resume" accept=".jpg" multiple>
        </label>

    </form>

</body>
</html>
