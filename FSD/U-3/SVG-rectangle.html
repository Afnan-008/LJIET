<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG-Rectangle</title>
</head>
<body>
    <svg width="900" height="300" style="border: 1px solid black;">
        <rect x="150" y="75" width="600" height="150" stroke="black" stroke-width="2" fill="blue" />
    </svg>

    <svg width="900" height="300" style="border: 1px solid black;">
        <rect x="150" y="75" rx="50" ry="50" width="600" height="150" stroke="black" stroke-width="2" fill="blue"/>
    </svg>
    <svg width="300" height="300" style="border: 1px solid black;">
        <rect x="50" y="50" rx="100" ry="100" width="200" height="200" stroke="black" stroke-width="2" fill="blue"/>
    </svg><br><br>
    <svg width="600" height="300" style="border: 1px solid black;">
        <rect x="0" y="0" width="600" height="100" stroke="orange" stroke-width="1" fill="orange" />
        
        <rect x="0" y="100" width="600" height="100" stroke="white" stroke-width="1" fill="white" />
        <circle cx="300" cy="150" r="48" stroke="blue" stroke-width="1" fill="blue"/>
        <rect x="0" y="200" width="600" height="100" stroke="green" stroke-width="1" fill="green" />
    </svg>
</body>
</html>
