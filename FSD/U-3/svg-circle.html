<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG-Circle</title>
</head>
<body>
    <svg width="500" height="500" style="border: 1px solid black;">
        <circle cx="250" cy="250" r="200" stroke="red" stroke-width="2" fill="blue"/>
    </svg>

    <svg width="500" height="500" style="border: 1px solid black;">
        <circle  r="200" stroke="black" stroke-width="2" fill="red"/>
        <circle cx="500"  r="200" stroke="black" stroke-width="2" fill="blue"/>
        <circle cx="250" cy="250" r="100" stroke="black" stroke-width="2" fill="green"/>
        <circle cy="500" r="200" stroke="black" stroke-width="2" fill="yellow"/>
        <circle cx="500" cy="500" r="200" stroke="black" stroke-width="2" fill="pink"/>
    </svg>
</body>
</html>
