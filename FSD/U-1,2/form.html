<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal Identity Access</title>
    <style>
        /* --- Core Reset & Design Variables --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-canvas: #f8fafc;
            --surface-card: #ffffff;
            --brand-primary: #0f172a;      /* Corporate Slate Blue */
            --brand-accent: #2563eb;       /* Enterprise Blue */
            --brand-accent-hover: #1d4ed8;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-ui: #e2e8f0;
            --input-focus-ring: rgba(37, 99, 235, 0.15);
            --transition-speed: 0.35s;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* --- Split-View Dual Panel Container --- */
        .portal-wrapper {
            background-color: var(--surface-card);
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.08);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* --- Form Component Panel Base Architecture --- */
        .form-panel {
            flex: 1;
            padding: 3.5rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
            width: 50%;
        }

        /* Panel Separation Border */
        .form-panel.login-section {
            border-right: 1px solid var(--border-ui);
        }

        /* --- Header Typography Elements --- */
        .panel-header {
            margin-bottom: 2rem;
        }

        .panel-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--brand-primary);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .panel-header p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* --- Global Form Layout Framework --- */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #ffffff;
            border: 1px solid var(--border-ui);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--brand-accent);
            box-shadow: 0 0 0 4px var(--input-focus-ring);
        }

        /* --- Micro Utilities Context Elements --- */
        .form-utilities {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-container input {
            accent-color: var(--brand-accent);
        }

        .text-link {
            color: var(--brand-accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .text-link:hover {
            color: var(--brand-accent-hover);
            text-decoration: underline;
        }

        /* --- Primary & Secondary Action Elements --- */
        .btn-primary {
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--brand-primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .btn-primary:hover {
            background-color: #1e293b;
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .btn-accent {
            background-color: var(--brand-accent);
        }

        .btn-accent:hover {
            background-color: var(--brand-accent-hover);
        }

        /* --- Responsive Framework Breakpoints --- */
        @media (max-width: 868px) {
            .portal-wrapper {
                flex-direction: column;
                max-width: 480px;
                min-height: auto;
            }

            .form-panel {
                width: 100%;
                padding: 2.5rem 2rem;
            }

            .form-panel.login-section {
                border-right: none;
                border-bottom: 1px solid var(--border-ui);
            }
        }
    </style>
</head>
<body>

    <!-- Unified Split Portal Frame -->
    <div class="portal-wrapper">

        <!-- SEPARATE LEFT PANEL: IDENTITY PORTAL LOGIN -->
        <section class="form-panel login-section">
            <div class="panel-header">
                <h1>Account Sign In</h1>
                <p>Access your organization's administrative console.</p>
            </div>

            <form class="auth-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="login-email">Corporate Email</label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@company.com" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="form-utilities">
                    <label class="checkbox-container">
                        <input type="checkbox"> Remember device
                    </label>
                    <a href="#" class="text-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Authenticate Identity</button>
            </form>
        </section>

        <!-- SEPARATE RIGHT PANEL: IDENTITY PORTAL PROVISIONING (SIGNUP) -->
        <section class="form-panel signup-section">
            <div class="panel-header">
                <h1>Registration Portal</h1>
                <p>Provision your secure corporate credential profile node.</p>
            </div>

            <form class="auth-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="signup-name">Full Account Name</label>
                    <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="signup-email">Designated Email</label>
                    <input type="email" id="signup-email" class="form-control" placeholder="name@company.com" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="signup-password">Secure Password</label>
                    <input type="password" id="signup-password" class="form-control" placeholder="Create high entropy security key" required autocomplete="new-password">
                </div>

                <div class="form-utilities">
                    <label class="checkbox-container" style="font-size: 0.8rem;">
                        <input type="checkbox" required> I agree to internal privacy governance protocols
                    </label>
                </div>

                <button type="submit" class="btn-primary btn-accent">Register Account Node</button>
            </form>
        </section>

    </div>

</body>
</html>
