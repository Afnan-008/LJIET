<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Folding Wedding Invitation - Mufaddal</title>
  <!-- Bootstrap 5.3.9 CSS -->
  <link href="https://jsdelivr.net" rel="stylesheet">
  <!-- Traditional Calligraphy & Serif Google Fonts -->
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    :root {
      --royal-maroon: #4a040e;
      --deep-crimson: #6e0817;
      --antique-gold: #d4af37;
      --bright-gold: #f6e27a;
      --ivory-cream: #fdf8ee;
      --warm-parchment: #f5ebd6;
    }

    body {
      background: radial-gradient(circle at center, var(--deep-crimson) 0%, #1c0104 100%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Floating Golden Sparkles */
    .bg-sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle, var(--bright-gold) 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      animation: floatUp 10s infinite ease-in-out;
    }

    .sparkle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 9s; }
    .sparkle:nth-child(2) { left: 25%; animation-delay: 2s; animation-duration: 12s; width: 12px; height: 12px; }
    .sparkle:nth-child(3) { left: 45%; animation-delay: 4s; animation-duration: 8s; }
    .sparkle:nth-child(4) { left: 65%; animation-delay: 1s; animation-duration: 11s; width: 10px; height: 10px; }
    .sparkle:nth-child(5) { left: 80%; animation-delay: 3s; animation-duration: 10s; }
    .sparkle:nth-child(6) { left: 92%; animation-delay: 5s; animation-duration: 13s; width: 11px; height: 11px; }

    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
      30% { opacity: 0.85; }
      70% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* 3D Perspective Container */
    .card-scene {
      perspective: 2200px;
      position: relative;
      z-index: 2;
    }

    .folding-book {
      position: relative;
      width: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
    }

    /* ================= FRONT COVER (FOLDED STATE) ================= */
    .card-cover {
      position: absolute;
      inset: 0;
      z-index: 10;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.3s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.6s ease 0.7s, visibility 0s linear 1.3s;
      background: linear-gradient(145deg, #5c0512 0%, #360209 100%);
      border: 4px solid var(--antique-gold);
      border-radius: 1rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
    }

    .card-cover-inner-border {
      border: 2px solid var(--antique-gold);
      border-radius: 160px 160px 12px 12px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, transparent 75%);
    }

    /* Opened State: Cover swings open to the left and fades out */
    .folding-book.is-open .card-cover {
      transform: rotateY(-165deg);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Wax Seal Button */
    .wax-seal-btn {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f6e27a 0%, #d4af37 45%, #8c6211 90%, #5e3f06 100%);
      border: 4px double #4a040e;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 0 0 rgba(246, 226, 122, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #4a040e;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.3s ease;
      animation: sealPulse 2.2s infinite;
      margin: 1.5rem auto;
    }

    .wax-seal-btn:hover {
      transform: scale(1.1) rotate(5deg);
    }

    @keyframes sealPulse {
      0%, 100% { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 0 0 rgba(246, 226, 122, 0.7); }
      50% { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 0 16px rgba(246, 226, 122, 0); }
    }

    /* ================= INSIDE CARD CONTENT ================= */
    .royal-card {
      background-color: var(--ivory-cream);
      background-image: radial-gradient(rgba(212, 175, 55, 0.08) 1px, transparent 0);
      background-size: 20px 20px;
      border: 3px solid var(--antique-gold);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 30px rgba(212, 175, 55, 0.25);
      position: relative;
      overflow: hidden;
    }

    .inner-arch-frame {
      border: 2px solid var(--antique-gold);
      border-radius: 180px 180px 16px 16px;
      position: relative;
      background: linear-gradient(180deg, rgba(253, 248, 238, 0.96) 0%, rgba(245, 235, 214, 0.98) 100%);
      box-shadow: inset 0 0 25px rgba(212, 175, 55, 0.2);
    }

    /* Rotating Mandala Graphics */
    .mandala-top {
      width: 150px;
      height: 150px;
      margin: -75px auto 10px;
      animation: spinSlow 45s linear infinite;
      filter: drop-shadow(0 4px 10px rgba(74, 4, 14, 0.3));
    }

    .mandala-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 340px;
      height: 340px;
      transform: translate(-50%, -50%);
      opacity: 0.07;
      pointer-events: none;
      animation: spinReverse 60s linear infinite;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }

    /* Corner Floral Ornaments */
    .corner-ornament {
      position: absolute;
      width: 60px;
      height: 60px;
      fill: var(--antique-gold);
      opacity: 0.85;
      pointer-events: none;
    }
    .corner-tl { top: 10px; left: 10px; }
    .corner-tr { top: 10px; right: 10px; transform: scaleX(-1); }
    .corner-bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .corner-br { bottom: 10px; right: 10px; transform: scale(-1, -1); }

    /* Gold Foil Shimmer Effect on Names */
    .gold-foil-text {
      font-family: 'Great Vibes', cursive;
      font-size: 3.6rem;
      line-height: 1.1;
      background: linear-gradient(
        110deg,
        #7a1020 15%,
        #b8860b 35%,
        #f6e27a 50%,
        #b8860b 65%,
        #7a1020 85%
      );
      background-size: 220% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: goldShimmer 4.5s linear infinite;
    }

    .cover-gold-text {
      font-family: 'Great Vibes', cursive;
      font-size: 3.8rem;
      background: linear-gradient(110deg, #d4af37 20%, #fff3b0 50%, #d4af37 80%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: goldShimmer 3.5s linear infinite;
    }

    @keyframes goldShimmer {
      to { background-position: 220% center; }
    }

    .heading-royal {
      font-family: 'Cinzel Decorative', serif;
      color: var(--royal-maroon);
      letter-spacing: 1.5px;
    }

    /* Hanging Lanterns Sway Animation */
    .lantern-sway {
      display: inline-block;
      transform-origin: top center;
      animation: swayLantern 3.5s ease-in-out infinite alternate;
    }

    .lantern-sway.delay {
      animation-delay: 1.2s;
    }

    @keyframes swayLantern {
      0% { transform: rotate(-6deg); }
      100% { transform: rotate(6deg); }
    }

    /* Event Cards Hover Lift */
    .ceremony-box {
      background: #ffffff;
      border: 1.5px solid var(--antique-gold);
      border-radius: 12px;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .ceremony-box:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(110, 8, 23, 0.15);
    }

    .ceremony-header {
      background: linear-gradient(90deg, var(--royal-maroon), var(--deep-crimson), var(--royal-maroon));
      color: var(--bright-gold);
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    /* Royal Button */
    .btn-royal {
      background: linear-gradient(135deg, var(--royal-maroon) 0%, var(--deep-crimson) 100%);
      color: var(--bright-gold);
      border: 2px solid var(--antique-gold);
      font-family: 'Cinzel Decorative', serif;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .btn-royal:hover {
      background: linear-gradient(135deg, var(--antique-gold) 0%, #b8860b 100%);
      color: var(--royal-maroon);
      border-color: var(--royal-maroon);
      transform: scale(1.03);
    }

    .divider-ornament {
      width: 220px;
      height: 24px;
      margin: 0.75rem auto;
    }
  </style>
</head>
