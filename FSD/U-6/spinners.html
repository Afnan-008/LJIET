<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <style>
        .custom-dual-spinner {
  position: relative;
  width: 56px;
  height: 56px;
}

/* Outer and inner rings */
.custom-dual-spinner::before,
.custom-dual-spinner::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 4px solid transparent;
}

/* Outer ring: Fast clockwise spin */
.custom-dual-spinner::before {
  border-top-color: #0d6efd; /* Bootstrap Primary Blue */
  border-right-color: #0d6efd;
  animation: spin-cw 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
}

/* Inner ring: Slower counter-clockwise spin */
.custom-dual-spinner::after {
  inset: 10px;
  border-bottom-color: #0dcaf0; /* Bootstrap Info Cyan */
  border-left-color: #0dcaf0;
  animation: spin-ccw 1.4s linear infinite;
}

@keyframes spin-cw {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes spin-ccw {
  0% { transform: rotate(360deg); }
  100% { transform: rotate(0deg); }
}

.tracking-wide {
  letter-spacing: 0.15em;
}

    </style>
</head>
<body>
    <div class="spinner-border text-danger m-5"><img src="https://i.ytimg.com/vi/VLakzyKNnkI/sddefault.jpg" style="opacity: 0.5;"></div><br>
    <div class="spinner-grow text-danger m-5"><img style="opacity: 0.5;" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYMWB7RG7pJlHeX55j5OMAH3JzR0prgnc8xS3HlwvZXrbAgg4dgAenVks&s=10"></div>
    <div class="spinner-border text-primary"></div>
    <div class="spinner-border text-warning"></div><br><br><br>

    <button type="button" class="btn btn-primary">
        <span class="spinner-border text-danger"></span>    
    </button>

    <div class="spinner-border text-warning w-75 h-25"></div><br><br><br>
    
    <div class="spinner-border text-warning">
        <div class="spinner-border text-primary"></div>
    </div>
    
    
    
    
    <div class="d-flex flex-column justify-content-center align-items-center py-5">
  <div class="custom-dual-spinner" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <span class="mt-3 text-muted fw-medium small tracking-wide">LOADING</span>
</div>

</body>
</html>
